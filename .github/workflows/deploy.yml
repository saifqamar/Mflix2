name: MFlix CI/CD

on:
  push:
    branches:
      - main
      - doc-cont

  workflow_dispatch:

jobs:
  deploy-pm2:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2
        env:
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          echo "Connecting to EC2..."
          echo "User: [$EC2_USER]"
          echo "Host: [$EC2_HOST]"

          ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
            cd ~/mflix
            git pull origin main
            cd backend
            npm install
            pm2 restart mflix-backend --update-env
          EOF

  deploy-docker:
    if: github.ref == 'refs/heads/doc-cont'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/saifqamar/mflix-backend:latest \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/saifqamar/mflix-frontend:latest \
            ./frontend

      - name: Push Docker images
        run: |
          docker push ghcr.io/saifqamar/mflix-backend:latest
          docker push ghcr.io/saifqamar/mflix-frontend:latest

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy Docker containers to EC2
        env:
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          echo "Deploying Docker containers to EC2..."

          ssh -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
            cd ~/mflix-docker
            docker compose pull
            docker compose up -d
          EOF
